apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tekton-egress
  namespace: gpmidi-ml
spec:
  podSelector:
    matchLabels:
      tekton.dev/memberOf: tasks
  policyTypes:
  - Egress
  egress:
  # Tekton tasks need broad egress: Gitea clone, registry push, K8s API
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tekton-eventlistener
  namespace: gpmidi-ml
spec:
  podSelector:
    matchLabels:
      eventlistener: gitea-listener
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Gitea runs in Docker on the host and posts the webhook straight to this
  # Service, so the source is the node address, not a pod. Naming it explicitly
  # keeps the listener from being reachable by every pod in the cluster, and the
  # github interceptor authenticates the payload regardless.
  - from:
    - ipBlock:
        cidr: 192.168.30.2/32
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - {}
