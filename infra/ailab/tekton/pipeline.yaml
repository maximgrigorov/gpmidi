---
# Authoritative delivery pipeline. Ordering is fail-closed: nothing is built until
# every source gate passes, nothing is deployed until the built image has been
# audited and scanned, and nothing is declared live until the running pod's
# imageID has been proven equal to the published digest.
#
#   clone(exact SHA, verified)
#     -> test-gates ............ three test suites in their two environments
#     -> static-gates .......... lint, whitespace, shell, render, schema, policy
#     -> security-gates ........ secret scan, dependency + license review
#     -> pvc-before ............ record data-bearing volume identities
#     -> build/audit per image . kaniko (linux/amd64, immutable SHA tag only) then
#                                digest match, arch, effective user, content,
#                                vulnerability scan
#     -> deploy-* .............. patch by digest, wait rollout, verify imageID
#     -> pvc-after ............. prove volumes were not replaced
#     -> smoke-* ............... focused readiness probes
#     -> live-e2e .............. fourteen fail-closed acceptance scenarios
#     -> publish-evidence ...... archive the bundle (always runs)
#
# Gate groups and per-image build/audit pairs are chained rather than parallel:
# the namespace ResourceQuota caps limits.cpu at 12 and the running application
# pods already hold about 5.7, so only one heavy pod may exist at a time.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gpmidi-ci
  namespace: gpmidi-ml
spec:
  params:
  - name: repo-url
    type: string
    default: http://192.168.30.2:3300/mgrigorov/gpmidi.git
  - name: revision
    description: Full commit SHA to build. A ref is resolved and recorded.
    type: string
  - name: expected-sha
    description: Optional guard; the checkout must equal this SHA when set.
    type: string
    default: ""
  - name: registry
    type: string
    default: 192.168.30.2:3300
  - name: registry-owner
    type: string
    default: mgrigorov
  - name: ci-image
    description: Pinned CI gate image built by the gpmidi-ci-image pipeline.
    type: string
  - name: run-name
    description: Name used for the archived evidence bundle.
    type: string
    default: gpmidi-ci
  workspaces:
  - name: shared-workspace
  - name: evidence
  - name: evidence-archive
  - name: docker-config

  results:
  - name: commit-sha
    value: $(tasks.clone.results.commit-sha)
  - name: asset-api-digest
    value: $(tasks.build-asset-api.results.digest)
  - name: reference-time-digest
    value: $(tasks.build-reference-time.results.digest)
  - name: gpmidi-web-digest
    value: $(tasks.build-gpmidi-web.results.digest)
  - name: sheetsage2-service-digest
    value: $(tasks.build-sheetsage2-service.results.digest)
  - name: asset-api-pod-image-id
    value: $(tasks.deploy-asset-api.results.pod-image-id)
  - name: reference-time-pod-image-id
    value: $(tasks.deploy-reference-time.results.pod-image-id)
  - name: gpmidi-web-pod-image-id
    value: $(tasks.deploy-gpmidi-web.results.pod-image-id)
  - name: sheetsage2-service-pod-image-id
    value: $(tasks.deploy-sheetsage2-service.results.pod-image-id)
  - name: asset-api-previous-image
    value: $(tasks.deploy-asset-api.results.previous-image)
  - name: reference-time-previous-image
    value: $(tasks.deploy-reference-time.results.previous-image)
  - name: gpmidi-web-previous-image
    value: $(tasks.deploy-gpmidi-web.results.previous-image)
  - name: sheetsage2-service-previous-image
    value: $(tasks.deploy-sheetsage2-service.results.previous-image)

  tasks:
  - name: clone
    taskRef:
      name: git-clone-exact
    params:
    - name: repo-url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)
    - name: expected-sha
      value: $(params.expected-sha)
    workspaces:
    - name: source
      workspace: shared-workspace

  # Tests first: they are the gate most likely to catch a real defect.
  - name: test-gates
    taskRef:
      name: test-gates
    runAfter: [clone]
    params:
    - name: ci-image
      value: $(params.ci-image)
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence

  - name: static-gates
    taskRef:
      name: static-gates
    runAfter: [test-gates]
    params:
    - name: ci-image
      value: $(params.ci-image)
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence

  - name: security-gates
    taskRef:
      name: security-gates
    runAfter: [static-gates]
    params:
    - name: ci-image
      value: $(params.ci-image)
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence

  # Recorded before anything is built or deployed, so the after-snapshot proves
  # the deploy did not replace a data-bearing volume.
  - name: pvc-before
    taskRef:
      name: pvc-persistence-check
    runAfter: [clone]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: phase
      value: before
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence

  - name: build-asset-api
    taskRef:
      name: kaniko-build-push
    runAfter: [security-gates]
    params:
    - name: image
      value: $(params.registry)/$(params.registry-owner)/asset-api:$(tasks.clone.results.commit-sha)
    - name: context
      value: services/asset_api
    - name: dockerfile
      value: services/asset_api/Dockerfile
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: docker-config
      workspace: docker-config

  - name: build-reference-time
    taskRef:
      name: kaniko-build-push
    runAfter: [audit-asset-api]
    params:
    - name: image
      value: $(params.registry)/$(params.registry-owner)/reference-time:$(tasks.clone.results.commit-sha)
    - name: context
      value: services/reference_time
    - name: dockerfile
      value: services/reference_time/Dockerfile
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: docker-config
      workspace: docker-config

  - name: build-sheetsage2-service
    taskRef:
      name: kaniko-build-push
    runAfter: [audit-reference-time]
    params:
    - name: image
      value: $(params.registry)/$(params.registry-owner)/sheetsage2-service:$(tasks.clone.results.commit-sha)
    - name: context
      value: services/sheetsage2_service
    - name: dockerfile
      value: services/sheetsage2_service/Dockerfile.worker
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: docker-config
      workspace: docker-config

  - name: build-gpmidi-web
    taskRef:
      name: kaniko-build-push
    runAfter: [audit-sheetsage2-service]
    params:
    - name: image
      value: $(params.registry)/$(params.registry-owner)/gpmidi-web:$(tasks.clone.results.commit-sha)
    - name: context
      value: .
    - name: dockerfile
      value: Dockerfile
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: docker-config
      workspace: docker-config

  - name: audit-asset-api
    taskRef:
      name: image-audit
    runAfter: [build-asset-api]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: image
      value: $(params.registry)/$(params.registry-owner)/asset-api:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-asset-api.results.digest)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    - name: name
      value: asset-api
    - name: expect-user
      value: "appuser|1000"
    workspaces:
    - name: evidence
      workspace: evidence
    - name: docker-config
      workspace: docker-config

  - name: audit-reference-time
    taskRef:
      name: image-audit
    runAfter: [build-reference-time]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: image
      value: $(params.registry)/$(params.registry-owner)/reference-time:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-reference-time.results.digest)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    - name: name
      value: reference-time
    - name: expect-user
      value: "appuser|1000"
    workspaces:
    - name: evidence
      workspace: evidence
    - name: docker-config
      workspace: docker-config

  - name: audit-sheetsage2-service
    taskRef:
      name: image-audit
    runAfter: [build-sheetsage2-service]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: image
      value: $(params.registry)/$(params.registry-owner)/sheetsage2-service:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-sheetsage2-service.results.digest)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    - name: name
      value: sheetsage2-service
    - name: expect-user
      value: "sheetsage|10001"
    workspaces:
    - name: evidence
      workspace: evidence
    - name: docker-config
      workspace: docker-config

  - name: audit-gpmidi-web
    taskRef:
      name: image-audit
    runAfter: [build-gpmidi-web]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: image
      value: $(params.registry)/$(params.registry-owner)/gpmidi-web:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-gpmidi-web.results.digest)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    - name: name
      value: gpmidi-web
    - name: expect-user
      value: "gpmidi|10001"
    workspaces:
    - name: evidence
      workspace: evidence
    - name: docker-config
      workspace: docker-config

  # Deployment happens only after the source gates, the image audit and the
  # vulnerability scan have all passed, and after the PVC baseline exists.
  - name: deploy-asset-api
    taskRef:
      name: deploy-by-digest
    runAfter: [audit-asset-api, pvc-before]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: deployment
      value: asset-api
    - name: container
      value: asset-api
    - name: image
      value: $(params.registry)/$(params.registry-owner)/asset-api:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-asset-api.results.digest)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    workspaces:
    - name: evidence
      workspace: evidence

  - name: deploy-reference-time
    taskRef:
      name: deploy-by-digest
    runAfter: [audit-reference-time, deploy-asset-api]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: deployment
      value: reference-time
    - name: container
      value: reference-time
    - name: image
      value: $(params.registry)/$(params.registry-owner)/reference-time:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-reference-time.results.digest)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    workspaces:
    - name: evidence
      workspace: evidence

  - name: sync-sheetsage2-models
    taskRef:
      name: sheetsage2-model-sync
    runAfter: [audit-sheetsage2-service]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: image
      value: $(params.registry)/$(params.registry-owner)/sheetsage2-service:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-sheetsage2-service.results.digest)
    workspaces:
    - name: evidence
      workspace: evidence

  - name: deploy-sheetsage2-service
    taskRef:
      name: deploy-by-digest
    runAfter: [sync-sheetsage2-models, deploy-reference-time]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: deployment
      value: sheetsage2-service
    - name: container
      value: sheetsage2-service
    - name: image
      value: $(params.registry)/$(params.registry-owner)/sheetsage2-service:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-sheetsage2-service.results.digest)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    - name: worker-image-env
      value: SHEETSAGE2_WORKER_IMAGE
    workspaces:
    - name: evidence
      workspace: evidence

  - name: deploy-gpmidi-web
    taskRef:
      name: deploy-by-digest
    runAfter: [audit-gpmidi-web, deploy-sheetsage2-service]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: deployment
      value: gpmidi-web
    - name: container
      value: gpmidi-web
    - name: image
      value: $(params.registry)/$(params.registry-owner)/gpmidi-web:$(tasks.clone.results.commit-sha)
    - name: digest
      value: $(tasks.build-gpmidi-web.results.digest)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    workspaces:
    - name: evidence
      workspace: evidence

  - name: pvc-after
    taskRef:
      name: pvc-persistence-check
    runAfter: [deploy-gpmidi-web]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: phase
      value: after
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence

  - name: smoke-asset-api
    taskRef:
      name: smoke-test
    runAfter: [pvc-after]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: service-name
      value: asset-api
    - name: healthz-path
      value: /asset-api/readyz
    workspaces:
    - name: evidence
      workspace: evidence

  - name: smoke-reference-time
    taskRef:
      name: smoke-test
    runAfter: [pvc-after]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: service-name
      value: reference-time
    - name: healthz-path
      value: /reference-time/readyz
    workspaces:
    - name: evidence
      workspace: evidence

  - name: smoke-sheetsage2-service
    taskRef:
      name: smoke-test
    runAfter: [pvc-after]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: service-name
      value: sheetsage2-service
    - name: healthz-path
      value: /healthz
    workspaces:
    - name: evidence
      workspace: evidence

  - name: smoke-gpmidi-web
    taskRef:
      name: smoke-test
    runAfter: [pvc-after]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: service-name
      value: gpmidi-web
    - name: port
      value: "8080"
    - name: healthz-path
      value: /healthz
    workspaces:
    - name: evidence
      workspace: evidence

  - name: live-e2e
    taskRef:
      name: live-e2e
    runAfter: [smoke-asset-api, smoke-reference-time, smoke-sheetsage2-service, smoke-gpmidi-web]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence

  # Runs whatever happened above, so a failed run is still diagnosable.
  finally:
  - name: publish-evidence
    taskRef:
      name: publish-evidence
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: commit-sha
      value: $(tasks.clone.results.commit-sha)
    - name: run-name
      value: $(params.run-name)
    workspaces:
    - name: evidence
      workspace: evidence
    - name: evidence-archive
      workspace: evidence-archive
---
# Bootstrap pipeline for the CI gate image itself. Separate so the image the
# gates run in is also built on AILab by Tekton, never on a workstation.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gpmidi-ci-image
  namespace: gpmidi-ml
spec:
  params:
  - name: repo-url
    type: string
    default: http://192.168.30.2:3300/mgrigorov/gpmidi.git
  - name: revision
    type: string
  - name: registry
    type: string
    default: 192.168.30.2:3300
  - name: registry-owner
    type: string
    default: mgrigorov
  workspaces:
  - name: shared-workspace
  - name: docker-config
  results:
  - name: commit-sha
    value: $(tasks.clone.results.commit-sha)
  - name: ci-image-digest
    value: $(tasks.build-ci-image.results.digest)
  tasks:
  - name: clone
    taskRef:
      name: git-clone-exact
    params:
    - name: repo-url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: build-ci-image
    taskRef:
      name: kaniko-build-push
    runAfter: [clone]
    params:
    - name: image
      value: $(params.registry)/$(params.registry-owner)/gpmidi-ci:$(tasks.clone.results.commit-sha)
    - name: context
      value: .
    - name: dockerfile
      value: infra/ailab/tekton/Dockerfile.ci
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: docker-config
      workspace: docker-config
---
# Deliberate negative-gate pipeline. Proves a failing gate cannot reach any task
# that publishes or deploys: this pipeline simply has no build or deploy task
# after the gates, and the injected failure is a parameter rather than committed
# code, so nothing broken is left on the feature branch.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gpmidi-ci-negative
  namespace: gpmidi-ml
spec:
  params:
  - name: repo-url
    type: string
    default: http://192.168.30.2:3300/mgrigorov/gpmidi.git
  - name: revision
    type: string
  - name: ci-image
    type: string
  - name: fail-gate
    description: Which gate to break — one of pytest, ruff, kubeconform, secret.
    type: string
    default: pytest
  workspaces:
  - name: shared-workspace
  - name: evidence
  tasks:
  - name: clone
    taskRef:
      name: git-clone-exact
    params:
    - name: repo-url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: inject-failure
    taskRef:
      name: inject-gate-failure
    runAfter: [clone]
    params:
    - name: ci-image
      value: $(params.ci-image)
    - name: fail-gate
      value: $(params.fail-gate)
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: test-gates
    taskRef:
      name: test-gates
    runAfter: [inject-failure]
    params:
    - name: ci-image
      value: $(params.ci-image)
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence
  - name: static-gates
    taskRef:
      name: static-gates
    runAfter: [test-gates]
    params:
    - name: ci-image
      value: $(params.ci-image)
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence
  - name: security-gates
    taskRef:
      name: security-gates
    runAfter: [static-gates]
    params:
    - name: ci-image
      value: $(params.ci-image)
    workspaces:
    - name: source
      workspace: shared-workspace
    - name: evidence
      workspace: evidence
  # There is deliberately NO build or deploy task here. The pipeline that can
  # mutate a Deployment is `gpmidi-ci`, and in it every build and deploy task runs
  # after the gate chain, so a red gate stops delivery by construction.
