apiVersion: batch/v1
kind: CronJob
metadata:
  name: tekton-prune
  namespace: gpmidi-ml
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: tekton-prune
          restartPolicy: OnFailure
          containers:
          - name: prune
            image: alpine:3.22
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              apk add --no-cache curl jq > /dev/null 2>&1
              curl -sLo /usr/local/bin/kubectl \
                "https://dl.k8s.io/release/v1.32.4/bin/linux/amd64/kubectl"
              chmod +x /usr/local/bin/kubectl

              echo "=== Pruning completed PipelineRuns older than 7 days ==="
              CUTOFF=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
                || date -u -v-7d '+%Y-%m-%dT%H:%M:%SZ')
              kubectl -n gpmidi-ml get pipelineruns -o json \
                | jq -r --arg cutoff "$CUTOFF" \
                  '.items[]
                   | select(.status.completionTime != null)
                   | select(.status.completionTime < $cutoff)
                   | .metadata.name' \
                | while read -r pr; do
                  echo "Deleting PipelineRun $pr"
                  kubectl -n gpmidi-ml delete pipelinerun "$pr" --wait=false
                done

              echo "=== Pruning orphaned workspace PVCs ==="
              kubectl -n gpmidi-ml get pvc -o json \
                | jq -r '.items[]
                   | select(.metadata.name | startswith("pvc-"))
                   | select(.metadata.labels["tekton.dev/pipeline"] // "" != "")
                   | select(.status.phase == "Bound")
                   | .metadata.name' \
                | while read -r pvc; do
                  OWNER=$(kubectl -n gpmidi-ml get pvc "$pvc" \
                    -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null || true)
                  if [ -n "$OWNER" ]; then
                    EXISTS=$(kubectl -n gpmidi-ml get pipelinerun "$OWNER" \
                      -o name 2>/dev/null || true)
                    if [ -z "$EXISTS" ]; then
                      echo "Deleting orphaned PVC $pvc (owner $OWNER gone)"
                      kubectl -n gpmidi-ml delete pvc "$pvc" --wait=false
                    fi
                  fi
                done

              echo "=== Pruning done ==="
