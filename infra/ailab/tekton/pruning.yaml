apiVersion: batch/v1
kind: CronJob
metadata:
  name: tekton-prune
  namespace: gpmidi-ml
spec:
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: tekton-prune
          restartPolicy: OnFailure
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: prune
            # The pinned CI image already carries kubectl and jq, so the prune job
            # does not download a binary on every run.
            image: 192.168.30.2:3300/mgrigorov/gpmidi-ci:pinned
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -eu
              RETAIN_COMPLETED_RUNS=4
              echo "=== Retaining newest ${RETAIN_COMPLETED_RUNS} completed PipelineRuns ==="
              kubectl -n gpmidi-ml get pipelineruns -o json \
                | jq -r --argjson retain "$RETAIN_COMPLETED_RUNS" \
                  '.items
                   | map(select(.status.completionTime != null))
                   | sort_by(.status.completionTime)
                   | reverse
                   | .[$retain:][]?
                   | .metadata.name' \
                | while read -r pr; do
                  echo "Deleting completed PipelineRun $pr"
                  kubectl -n gpmidi-ml delete pipelinerun "$pr" --wait=false
                done

              echo "=== Pruning orphaned workspace PVCs ==="
              kubectl -n gpmidi-ml get pvc -o json \
                | jq -r '.items[]
                   | select(.metadata.name | startswith("pvc-"))
                   | select(.metadata.ownerReferences[0].kind == "PipelineRun")
                   | select(.status.phase == "Bound")
                   | .metadata.name' \
                | while read -r pvc; do
                  OWNER=$(kubectl -n gpmidi-ml get pvc "$pvc" \
                    -o jsonpath='{.metadata.ownerReferences[0].name}' 2>/dev/null || true)
                  if [ -n "$OWNER" ]; then
                    EXISTS=$(kubectl -n gpmidi-ml get pipelinerun "$OWNER" \
                      -o name 2>/dev/null || true)
                    if [ -z "$EXISTS" ]; then
                      echo "Deleting orphaned PVC $pvc (owner $OWNER gone)"
                      kubectl -n gpmidi-ml delete pvc "$pvc" --wait=false
                    fi
                  fi
                done

              echo "=== Pruning done ==="
