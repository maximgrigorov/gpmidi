apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-pytorch-smoke
  namespace: gpmidi-ml
spec:
  backoffLimit: 2
  template:
    spec:
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pytorch
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command:
        - python3
        - -c
        - |
          import torch
          print(f"PyTorch version: {torch.__version__}")
          print(f"CUDA available: {torch.cuda.is_available()}")
          assert torch.cuda.is_available(), "CUDA not available!"
          print(f"Device: {torch.cuda.get_device_name(0)}")
          print(f"CUDA version: {torch.version.cuda}")
          a = torch.randn(1024, 1024, device="cuda")
          b = torch.randn(1024, 1024, device="cuda")
          c = torch.mm(a, b)
          torch.cuda.synchronize()
          expected = a.cpu() @ b.cpu()
          diff = (c.cpu() - expected).abs().max().item()
          print(f"Max matmul diff: {diff:.2e}")
          assert diff < 1e-2, f"Numerical error too large: {diff}"
          peak_mb = torch.cuda.max_memory_allocated() / 1024 / 1024
          print(f"Peak VRAM: {peak_mb:.1f} MB")
          print("PYTORCH CUDA SMOKE: PASS")
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 4Gi
            nvidia.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      restartPolicy: Never
