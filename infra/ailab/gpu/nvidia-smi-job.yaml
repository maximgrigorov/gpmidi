apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-nvidia-smi-smoke
  namespace: gpmidi-ml
spec:
  backoffLimit: 2
  template:
    spec:
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nvidia-smi
        image: nvidia/cuda:13.1.0-base-ubuntu24.04
        command: ["nvidia-smi"]
        resources:
          limits:
            nvidia.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      restartPolicy: Never
