apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sheetsage2-service
  namespace: gpmidi-ml
spec:
  podSelector:
    matchLabels:
      app: sheetsage2-service
  policyTypes: ["Ingress", "Egress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gpmidi-web
    - podSelector:
        matchLabels:
          tekton.dev/memberOf: tasks
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sheetsage2-worker
  namespace: gpmidi-ml
spec:
  podSelector:
    matchLabels:
      app: sheetsage2-worker
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
