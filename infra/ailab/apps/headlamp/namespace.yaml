apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    # Same posture as gpmidi-ml (base/namespace.yaml). The Headlamp pod actually
    # satisfies `restricted` — see the securityContext in values.yaml — but
    # enforcement stays at `baseline` so a chart upgrade that adds, say, an init
    # container cannot make the dashboard unschedulable; `warn`/`audit` still
    # report any drift from `restricted`.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
