apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference-time
  namespace: gpmidi-ml
  labels:
    app: reference-time
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reference-time
  template:
    metadata:
      labels:
        app: reference-time
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reference-time
        # Reviewed immutable digest, built from commit
        # 1485ed928d1363ada70b0e5c3f9067d638475dea by PipelineRun
        # gpmidi-ci-manual-6svjg. `kubectl apply -k infra/ailab` therefore
        # reproduces exactly the state that was verified. The pipeline
        # patches this to the digest it builds and then fails unless the
        # live pod imageID matches.
        image: 192.168.30.2:3300/mgrigorov/reference-time@sha256:9bb4347eea5a69473d64a6b8834d1bf4458e1fcd72494b8045920131b038cf2b
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: RT_DATA_ROOT
          value: /var/lib/reference-time
        # Bounded download scopes live on the service's own PVC, so a process
        # restart leaves at most one directory behind and startup purges it.
        - name: RT_TMP_ROOT
          value: /var/lib/reference-time/tmp
        - name: ASSET_API_URL
          value: http://asset-api.gpmidi-ml.svc.cluster.local:8000
        - name: CORS_ORIGINS
          value: "https://192.168.30.2,http://192.168.20.66:8082"
        - name: MAX_CONCURRENT_JOBS
          value: "2"
        - name: MAX_QUEUE_LENGTH
          value: "10"
        - name: JOB_TIMEOUT_SECONDS
          value: "300"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 1Gi
            ephemeral-storage: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/reference-time
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /reference-time/healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /reference-time/readyz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: reference-time-data
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
