apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reference-time
  namespace: gpmidi-ml
spec:
  podSelector:
    matchLabels:
      app: reference-time
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - podSelector:
        matchLabels:
          tekton.dev/memberOf: tasks
    ports:
    - protocol: TCP
      port: 8000
  # The Flask UI creates analyses, polls job status and proxies both reports.
  - from:
    - podSelector:
        matchLabels:
          app: gpmidi-web
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: asset-api
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
