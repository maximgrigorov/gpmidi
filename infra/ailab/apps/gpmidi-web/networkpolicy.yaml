apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpmidi-web
  namespace: gpmidi-ml
spec:
  podSelector:
    matchLabels:
      app: gpmidi-web
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Traefik (kube-system) serves the UI; Tekton E2E tasks probe it directly.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - podSelector:
        matchLabels:
          tekton.dev/memberOf: tasks
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: asset-api
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: reference-time
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
