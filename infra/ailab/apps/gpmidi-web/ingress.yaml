apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpmidi-web
  namespace: gpmidi-ml
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - secretName: ailab-tls
  rules:
  - host: gpmidi.ailab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gpmidi-web
            port:
              number: 8080
  # PoC usability fallback: allow opening the UI directly by AILab IP without
  # requiring a workstation-specific DNS or /etc/hosts entry. The existing
  # hostless /asset-api and /reference-time routes are longer prefixes and keep
  # precedence in Traefik.
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gpmidi-web
            port:
              number: 8080
