apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpmidi-app
  namespace: gpmidi-ml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpmidi-deployer
  namespace: gpmidi-ml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpmidi-deployer
  namespace: gpmidi-ml
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "update", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "create", "update", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpmidi-deployer
  namespace: gpmidi-ml
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpmidi-deployer
subjects:
- kind: ServiceAccount
  name: gpmidi-deployer
  namespace: gpmidi-ml
