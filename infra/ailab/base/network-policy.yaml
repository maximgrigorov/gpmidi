apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: gpmidi-ml
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gpmidi-ml
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: gpmidi-ml
spec:
  podSelector:
    matchLabels:
      app: smoke-app
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-web
  namespace: gpmidi-ml
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Intentionally broad: public image/model endpoints cannot be constrained
  # reliably by IP with standard NetworkPolicy. This permits all TCP 80/443,
  # not just registries; keep the boundary explicit in documentation.
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
