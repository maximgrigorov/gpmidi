apiVersion: v1
kind: ConfigMap
metadata:
  name: smoke-app-code
  namespace: gpmidi-ml
data:
  app.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json, os, hashlib, socket

    VERSION = "0.1.0"

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = json.dumps({
                    "status": "ok",
                    "version": VERSION,
                    "hostname": socket.gethostname(),
                })
                self._respond(200, body, "application/json")
            elif self.path == "/readyz":
                self._respond(200, '{"ready":true}', "application/json")
            elif self.path == "/storage":
                self._storage_check()
            elif self.path == "/":
                self._respond(200,
                    "<h1>AILab gpmidi-ml smoke deployment</h1>"
                    f"<p>Version {VERSION} on {socket.gethostname()}</p>",
                    "text/html")
            else:
                self._respond(404, "Not Found", "text/plain")

        def _storage_check(self):
            marker_path = "/var/lib/gpmidi/marker.txt"
            try:
                with open(marker_path, "r") as f:
                    content = f.read()
                sha = hashlib.sha256(content.encode()).hexdigest()
                body = json.dumps({"marker_sha256": sha, "status": "ok"})
                self._respond(200, body, "application/json")
            except FileNotFoundError:
                body = json.dumps({"status": "no_marker", "path": marker_path})
                self._respond(200, body, "application/json")

        def _respond(self, code, body, content_type):
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.end_headers()
            self.wfile.write(body.encode())

        def log_message(self, fmt, *args):
            pass

    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "8080"))
        server = HTTPServer(("0.0.0.0", port), Handler)
        print(f"Serving on :{port}")
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-app
  namespace: gpmidi-ml
  labels:
    app: smoke-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-app
  template:
    metadata:
      labels:
        app: smoke-app
    spec:
      serviceAccountName: gpmidi-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: python:3.12-slim
        command: ["python3", "/app/app.py"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: data
          mountPath: /var/lib/gpmidi
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: code
        configMap:
          name: smoke-app-code
      - name: data
        persistentVolumeClaim:
          claimName: smoke-pvc
      - name: tmp
        emptyDir:
          sizeLimit: 10Mi
