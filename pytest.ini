[pytest]
# Explicit collection roots. The authoritative root gate is `python -m pytest -q`
# from the repository root; it must stay hermetic — no live cluster, no SSH, no
# permanent remote data.
#
# Only the root (converter / Flask UI) suites are collected here. The two service
# suites are separate required gates run from their own directories, because they
# pin a different numpy than the converter does: `requirements.txt` pins
# numpy==1.23.2 (what the deployed converter image runs) while
# services/reference_time pins numpy==2.2.6. One interpreter cannot honestly hold
# both, so the CI image provides two environments and the pipeline runs:
#
#     python -m pytest -q                                  # this file
#     cd services/reference_time && python -m pytest -q    # service env
#     cd services/asset_api      && python -m pytest -q    # service env
#
# `e2e/` holds the post-deploy live acceptance runner. It is NOT a pytest suite:
# it is an executable module invoked by a dedicated Tekton task after rollout and
# it talks to a real deployed cluster. It must never be collected here. Its
# fail-closed contract is covered by test_e2e_runner_contract.py, which does no
# I/O at all.
testpaths =
    test_arrangement_openai.py
    test_arrangement_openai_web.py
    test_arrangement_processing.py
    test_arrangement_web.py
    test_arrangement_workflow.py
    test_compact_bends.py
    test_e2e_runner_contract.py
    test_gp_played_offsets.py
    test_hidden_32nds.py
    test_performance_life.py
    test_playable_tabs.py
    test_projects_ui.py
    test_regression.py
    test_upload_proxy.py
    test_verify_midi.py
norecursedirs =
    e2e
    third_party
    services
    .git
    __pycache__
    data
