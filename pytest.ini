[pytest]
# Explicit collection roots. The authoritative root gate is `python -m pytest -q`
# from the repository root; it must stay hermetic — no live cluster, no SSH, no
# permanent remote data.
#
# `e2e/` holds the post-deploy live acceptance runner. It is NOT a pytest suite:
# it is an executable module invoked by a dedicated Tekton task after rollout and
# it talks to a real deployed cluster. It must never be collected here.
testpaths =
    test_compact_bends.py
    test_gp_played_offsets.py
    test_hidden_32nds.py
    test_performance_life.py
    test_playable_tabs.py
    test_projects_ui.py
    test_regression.py
    test_upload_proxy.py
    services/asset_api/tests
    services/reference_time/tests
norecursedirs =
    e2e
    third_party
    .git
    __pycache__
    data
asyncio_mode = auto
