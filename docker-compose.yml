services:
  gpmidi-ui:
    build: .
    image: gpmidi-ui:latest
    container_name: gpmidi-ui
    restart: always            # автозапуск после ребута хоста / рестарта демона
    ports:
      - "8082:8080"            # как у прежнего контейнера
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      # Remote CUPS server / verified queue for HP LaserJet Professional P1102.
      - CUPS_SERVER=${CUPS_SERVER:-192.168.20.64}
      - CUPS_PRINTER=${CUPS_PRINTER:-HP_P1102}
    volumes:
      - ./data:/app/data       # сессии/загрузки переживают пересборку образа
