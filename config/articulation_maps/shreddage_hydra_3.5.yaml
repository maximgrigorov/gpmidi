# Shreddage 3.5 Hydra — карта артикуляций (guitar).
#
# Источники:
#   - Мануал: https://impactsoundworks.com/manuals/Shreddage%203%20Hydra%20Manual.pdf
#   - Пресет пользователя "- INIT S3.5 Hydra -" (скриншот, июль 2026).
#     При конфликте мануала и пресета доверяем ПРЕСЕТУ.
#
# Нотация: Kontakt (C-1 = MIDI 12). Все note — абсолютные MIDI-номера.
#
# Расхождения пресета с мануалом (зафиксированы, доверяем пресету):
#   - Pinch Harmonics: пресет = C-1 (12) vel 127; мануал = A#-1 без vel-сплита.
#   - Rake: пресет = C-1 (12) vel 120-126; мануал = vel 120-127 (на 1 шире).

instrument: "Shreddage 3.5 Hydra"
library_version: "3.5"
config_version: 1

# Дефолт мануала: +/- 2 полутона (НЕ 6). Если пользователь менял ручку
# PITCH BEND RANGE в Kontakt (MAIN tab) — обновить здесь и только здесь.
# ПРОВЕРЕНО 2026-07-15 (пользователь, ручка PITCH BEND RANGE в Hydra): дефолт
# инструмента = 2 полутона, и конфиг ему честно соответствовал. Но партитура
# содержит бенды глубже: BendDestinationValue 100/200/300 = 2/4/6 полутонов
# (замер по score.gpif — 8 нот на 2 ст, 4 ноты на 4 ст, 1 нота на 6 ст).
# При шкале 2 всё, что глубже, упиралось в потолок: 14 pitchwheel-событий
# стояли ровно на 8191, бенд рисовался как подъём + ПОЛКА + скачок — это и
# были "лесенки", которые приходилось править руками в Logic.
#
# Ставим 7: покрывает 6 полутонов (три тона) с запасом; пользователь то же
# значение подбирал вручную. Пропорциональность сохраняется — бенд на 2 ст
# даёт 8191*2/7 = 2340.
#
# !!! ЭТО ЗНАЧЕНИЕ ОБЯЗАНО СОВПАДАТЬ С РУЧКОЙ PITCH BEND RANGE В HYDRA !!!
# Kontakt не обязан слушать RPN, который шлёт emit_pitch_bend_range_rpn, —
# ручка выставляется в инструменте руками. Рассогласование = все бенды
# неверной глубины, причём молча.
pitch_bend_range: 7

keyswitches:
  sustain:              {note: 12, vel_min: 1, vel_max: 119}   # C-1, KS(L)
  palm_mute:            {note: 13}                             # C#-1 (P.M., ритм-секция!)
  staccato:             {note: 14}                             # D-1
  power_chord_sustain:  {note: 15}                             # D#-1
  power_chord_mute:     {note: 16}                             # E-1
  power_chord_staccato: {note: 17}                             # F-1
  tremolo:              {note: 18}                             # F#-1
  choke:                {note: 19}                             # G-1
  tapping:              {note: 20}                             # G#-1 (соло!)
  # Harmonics: у артикуляции СВОЙ диапазон сэмплов, уже обычного плейбл-рейнджа.
  # Эмпирика (pnd/Solo Guitar): звучащие высоты гармоник 80..88 (G#5..E6) дают
  # ТИШИНУ, при этом обычные ноты 84 (C6) под sustain звучат. pitch_mode:
  #   sounding — реальная звучащая высота, октавами вниз до max_note;
  #   fretted  — прижатая позиция из табулатуры как есть.
  # ПРОВЕРИТЬ в Kontakt/TACT (Articulations, колонка Key у Harmonics) и
  # уточнить max_note. Пока консервативно: E5 (76) = 12-й ладовый узел
  # верхней струны.
  harmonics:            {note: 21, pitch_mode: sounding, max_note: 76}  # A-1 (natural)
  fx:                   {note: 23}                             # B-1
  # Vel-зоны на ноте sustain (не отдельные keyswitch-ноты):
  rake:                 {note: 12, vel_min: 120, vel_max: 126}
  pinch_harmonics:      {note: 12, velocity: 127}

# Служебные/FX keyswitch-и (октава C0 = MIDI 24)
fx_keyswitches:
  legato_slide_to_next: 24    # C0  (non-latching, до 12 полутонов)
  fret_noise:           25    # C#0
  slide_in_out:         26    # D0
  thrash_note:          27    # D#0
  force_string_6: 0           # C-2 .. F-2 = струны 6..1
  force_string_5: 1
  force_string_4: 2
  force_string_3: 3
  force_string_2: 4
  force_string_1: 5
  force_string_off: 6         # F#-2
  force_hand_position: 10     # A#-2 (velocity = позиция)
  force_hand_position_off: 11 # B-2
  legato_on:  114             # F#8 (дефолт)
  legato_off: 115             # G8

# Какая артикуляция выигрывает, если в бите совпало несколько (раньше = важнее)
articulation_priority:
  - harmonics
  - tapping
  - tremolo
  - palm_mute
  - staccato
  - sustain

# Соответствие GP-эффектов артикуляциям Hydra (канонич. имя -> имя в keyswitches):
#   GP trill -> tremolo (у Hydra нет отдельной trill-артикуляции)
gp_effect_overrides:
  trill: tremolo
  tapped_harmonics: tapping
