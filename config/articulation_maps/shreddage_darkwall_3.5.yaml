# Shreddage 3.5 Darkwall — карта артикуляций (bass).
#
# Источник: https://impactsoundworks.com/manuals/Shreddage%203.5%20Darkwall%20Manual.pdf
#
# ВНИМАНИЕ: другой набор артикуляций и ДРУГИЕ ОКТАВЫ, чем у Hydra:
#   - основные keyswitch-и в октаве C-2 (MIDI 0..7), а не C-1;
#   - FX keyswitch-и в октаве C-1 (MIDI 12..15) — у Hydra это C0 (24..27);
#   - НЕТ Power Chord*, Rake, Choke, Tremolo, FX, отдельного Pinch Harmonics;
#   - Harmonics = Natural И Artificial ОДНОЙ артикуляцией (у Hydra — два KS).
#
# Нотация: Kontakt (C-2 = MIDI 0).

instrument: "Shreddage 3.5 Darkwall"
library_version: "3.5"
config_version: 1

# Дефолт мануала: +/- 2 полутона. Проверить фактическое значение ручки
# PITCH BEND RANGE в Kontakt-пресете пользователя (аналогично Hydra).
# ОТКРЫТЫЙ ВОПРОС: фактическое значение в пресете пользователя не проверено.
pitch_bend_range: 2

keyswitches:
  sustain:         {note: 0}   # C-2
  sustain_short:   {note: 1}   # C#-2
  staccato_long:   {note: 2}   # D-2  <- GP staccato маппим сюда (правь при желании)
  staccato_short:  {note: 3}   # D#-2
  palm_mute:       {note: 4}   # E-2
  tapping:         {note: 5}   # F-2
  # см. комментарий в shreddage_hydra_3.5.yaml: max_note = потолок диапазона
  # сэмплов артикуляции Harmonics (проверить в TACT), выше — октавами вниз
  harmonics:       {note: 6, pitch_mode: sounding, max_note: 76}   # F#-2 (Nat+Art объединены)
  buzz_trill:      {note: 7}   # G-2  <- GP trill маппим сюда

fx_keyswitches:
  legato_slide_to_next: 12    # C-1  (у Hydra — C0=24, на октаву выше!)
  fret_noise:           13    # C#-1
  slide_in_out:         14    # D-1
  thrash_note:          15    # D#-1
  legato_on:  114             # F#8 (совпадает с Hydra)
  legato_off: 115             # G8

articulation_priority:
  - harmonics
  - tapping
  - buzz_trill
  - palm_mute
  - staccato_long
  - staccato_short
  - sustain_short
  - sustain

# Соответствие GP-эффектов артикуляциям Darkwall:
#   GP staccato      -> staccato_long
#   GP trill         -> buzz_trill
#   GP tremolo pick. -> sustain (у Darkwall нет tremolo-артикуляции)
#   GP pinch harm.   -> harmonics (нет отдельного pinch)
gp_effect_overrides:
  staccato: staccato_long
  trill: buzz_trill
  pinch_harmonics: harmonics
  tapped_harmonics: tapping
