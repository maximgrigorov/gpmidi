# Профиль оживления гитары (Shreddage Hydra 3.5, metal / power metal).
#
# ЭТО НЕ БАРАБАННЫЙ ПРОФИЛЬ. Барабанную модель сюда переносить нельзя, у гитары
# другая физика и другие ограничения:
#
# 1. VELOCITY У HYDRA — ПЕРЕКЛЮЧАТЕЛЬ АРТИКУЛЯЦИИ, А НЕ ГРОМКОСТЬ.
#    На ноте sustain: 1-119 = обычный звук, 120-126 = RAKE, 127 = PINCH.
#    Перебор velocity здесь даёт не "громче", а случайный визг. Потолок берётся
#    из shreddage_hydra_3.5.yaml (sustain.vel_max), а НЕ отсюда: если поменяется
#    пресет — поменяется там, и профиль не придётся трогать.
#    Замер: барабанные числа (accent +6, std 6) на F=95 дают максимум 119 при
#    потолке 119 — запас РОВНО одна единица. Работает по случайности, не по
#    устройству. Поэтому здесь accent/std скромнее, и клампинг обязателен.
#
# 2. ТАЙМИНГ НЕЛЬЗЯ СДВИГАТЬ ПОСТ-ПРОХОДОМ. Keyswitch приходит за KS_LEAD_MS=15
#    до ноты. Нота, уехавшая назад на 20 мс, окажется раньше своего KS —
#    артикуляция сработает не на ту ноту. Поэтому сдвиг считается ДО эмиссии
#    KS/PB, на уровне бита, и всё остальное наследует уже сдвинутый тик.
#
# 3. ЛИГИ И ЛЕГАТО (LEGATO_OVERLAP_MS=40) считаются от start_tick — сдвиг обязан
#    быть общим для бита, иначе перекрытие рвётся. Необходимо, но НЕ достаточно:
#    легато связывает два соседних бита, и независимые сдвиги рвут ~половину
#    перекрытий hammer/pull (замер в LESSONS.md п.15).
#
# 4. ГОСТ-НОТ ЗДЕСЬ НЕТ И НЕ БУДЕТ. Тихая лишняя нота на перегрузе — это грязь,
#    а не жизнь. Аналог гостов у гитары — акцент медиатора и глубина глушения.

instrument: "Guitar"
profile: "metal"
config_version: 5

velocity:
  # В отличие от барабанов, динамика из GP осмысленна: ApolloTab отдаёт
  # 31/63/95 (PP/MP/F), то есть три уровня. Поэтому не синтезируем с нуля,
  # а МОДУЛИРУЕМ то, что пришло.
  floor: 20

  # Главная болезнь ритм-гитары: 0 акцентов на 966 битов при ровных
  # шестнадцатых — на слух "пулемёт". Акцент на долю возвращает риффу пульс.
  accent:
    beat: +8      # доля
    off8: +2      # офф-бит восьмая
    e16: -4       # слабая шестнадцатая
  std: 4          # разброс атаки медиатора; держим скромным из-за vel-зон

  # Открытый аккорд у метал-гитариста звучит акцентом, глушёный чёс — тише.
  # Имена совпадают с ключами keyswitches в карте артикуляций.
  articulation:
    palm_mute: -5
    sustain: +3
    power_chord_mute: -5
    power_chord_sustain: +3

timing:
  # Гитарист тише барабанщика по разбросу: правая рука привязана к медиатору.
  bias_ms: 0.0
  std_ms: 7.0
  tempo_ref_bpm: 90.0
  tempo_exponent: 0.5
  # Жёстче барабанного (0.20): рифф шестнадцатыми размазывать нельзя.
  max_shift_frac16: 0.12

strum:
  # Ноты аккорда у гитариста НЕ одновременны: медиатор проходит струны за
  # 10-25 мс, снизу вверх на ударе вниз. Сейчас все 796 пауэр-аккордов идеально
  # одновременны — отсюда синтетичность.
  enabled: true
  ms_per_string: 5.0     # задержка на каждую следующую струну
  max_spread_ms: 22.0    # потолок на весь аккорд
  # Пауэр-аккорд из 2 нот получит ~5 мс (почти вместе), полный из 5-6 — до 22.

  # Чередование хода медиатора по ЧЁТНОСТИ ШЕСТНАДЦАТОЙ (см. humanize.py):
  # восьмые попадают только на чётные -> сплошь вниз (метал-даунпикинг),
  # шестнадцатые -> честное вниз-вверх.
  alternate: true
  # Ход вверх у живой руки слабее и короче хода вниз: замах и гравитация.
  upstroke_vel: -4        # velocity на ходе вверх
  upstroke_spread_k: 0.8  # и разброс по струнам чуть плотнее
  # --pick-direction на соло: строгое чередование по взятым медиатором нотам
  # (цели hammer/слайда не берутся); пауза длиннее доли — снова вниз.
  solo_pick_reset_gap_frac16: 4.0
  # --pick-direction на ритме: «чёс вниз больше» (пользователь). Даунпикинг,
  # пока между ударами не меньше этого; чаще рука не успевает — чередование по
  # чётности шестнадцатой. 140 мс ~ восьмые на 214 BPM или шестнадцатые на
  # 107: предел, на котором метал-гитаристы держат сплошной даунпикинг. Время
  # физическое — в мс. pnd (16-е на 90 BPM, 167 мс) — вниз, Through the Night
  # (16-е на 120, 125 мс) — чередование.
  rhythm_downpick_min_ioi_ms: 140.0
  # Strum сдвигает ноты ТОЛЬКО ВПЕРЁД от тика бита: сдвиг назад увёл бы ноту
  # за собственный keyswitch (KS_LEAD_MS=15).

fret_hand_cost:
  # Перенос левой руки ЗАДЕРЖИВАЕТ атаку бита (флаг --fret-hand-cost, только
  # вместе с --humanize). Позиция руки — медиана прижатых ладов бита, та же
  # величина, на которой висит fret_noise; порог смены позиции НЕ здесь, а в
  # shreddage_hydra_3.5.yaml (performance_life.fret_noise_on_hand_shift.
  # min_fret_shift = 4): поменяется пресет — поменяется в одном месте.
  #
  # ЧТО МЕРЯЛИ (docs/evidence/fret-hand-shift-input.json, 3 песни, 2783 бита):
  #   перенос >= 4 ладов — 10.2% битов; на соло 25%, на ритме 3.1%
  #   (pnd Rhytm: 2 из 873). То есть это фича соло-партий: ритм-гитара рукой
  #   почти не ездит, и модель её честно не трогает.
  #   Размер прыжков на соло: чаще всего 5 и 7 ладов, хвост до октавы (12).
  #   22% переносов идут после паузы, 27% — через 600+ мс после прошлой ноты.
  #
  # ПОЧЕМУ ТАКАЯ ФОРМА:
  # 1. Время переноса физическое — в МС, без темповой поправки. В долях
  #    шестнадцатой та же задержка в быстрой песне выходила бы КОРОЧЕ
  #    (0.1 шестнадцатой = 12.5 мс на 120 BPM и 20 мс на 75), то есть наоборот.
  #    Правило *_frac16 (LESSONS.md п.7) — про тики; потолок здесь в frac16.
  # 2. Из стоимости вычитается тишина перед атакой: рука, отпустившая струну
  #    заранее, успевает. Без этого 22% задержек легли бы после пауз.
  # 3. Цели hammer/pull и слайда НЕ задерживаются (правило в коде, не число):
  #    ноту не бьют заново, перенос руки — это и есть сам слайд. Задержка цели
  #    рвала бы легато-перекрытие всегда (LESSONS.md п.15).
  # 4. Атака опаздывает, конец ноты — нет: задержанная нота короче. Иначе её
  #    хвост налез бы на следующую атаку, и Hydra сыграла бы там легато.
  #
  # ПОЧЕМУ ТАКИЕ ЧИСЛА. Датасета живой гитары у нас нет (паки квантованы,
  # LESSONS.md п.2), поэтому числа не сняты с исполнителя, а подобраны под два
  # измеримых ограничения: (а) задержка на прыжке обязана выделяться над шумом
  # humanize (std 7 мс), иначе её не отличить статистически; (б) общий разброс
  # гитары остаётся в коридоре 5-9 мс (LESSONS.md п.6). Проверено замером —
  # цифры до/после в docs/evidence/fret-hand-cost-acceptance.json.
  #
  # config_version 3 (2026-09-24): было 10/18 мс. Когда авторские сдвиги GP
  # стали дефолтом соло, коридор меряется средним по 60 сидам против эталона
  # без оживления, и Spring Melody Solo (самая медленная песня, 75 BPM) вышел
  # на 9.01 мс. Перебор: 9/16 -> 8.78 мс, проверка видит фичу на 39-40 из 40
  # сидов; 8/15 -> 8.65, но уже 38/40 на Through the Night Solo. Взято 9/16.
  in_position_ms_per_fret: 1.0   # внутри позиции: 3 лада = 3 мс, почти даром
  shift_ms: 9.0                  # смена позиции: сразу 9 мс на пороге
  saturation_ms: 16.0            # асимптота: 5 ладов = 10.5, 7 = 12.7, октава = 15.1 мс
  saturation_frets: 4.0          # за сколько ладов сверх порога набегает ~63% остатка
  max_delay_frac16: 0.15         # потолок: доля шестнадцатой (на 120 BPM = 18.75 мс)
  max_delay_note_frac: 0.5       # и не больше половины собственной длительности бита

lock_to_drums:
  # Ритм-секция вместе (флаг --lock-to-drums, только с --humanize; решение
  # пользователя 2026-09-24: «чтобы звучали в коалиции, как в метал-группе»).
  # Бит берёт сдвиг бочки на том же нотном тике, иначе малого, между ними —
  # плавную линию тайминга барабанщика; барабанов дальше max_anchor_gap — бит
  # играется свободно (обычный timing выше).
  #
  # ЧТО МЕРЯЛИ (3 песни, нотная сетка): на бочку и малый приходится 35-70%
  # атак ритма и баса, на любой удар барабанов — до 87%. Почти-совпадений в
  # пределах 1/32 нет (0-18 на дорожку) — расхождения с бочкой это аранжировка,
  # а не ошибки транскрипции, поэтому партии НЕ правятся, сводится только тайминг.
  # Без привязки гитара и бочка расходятся на унисонах на ~11 мс (7 мс гитары и
  # 9 мс бочки независимо) — это и есть «каждый сам по себе».
  #
  # ПОЧЕМУ ТАКИЕ ЧИСЛА. С исполнителя не сняты: это допуск, с которым в метале
  # сводят бас и ритм к бочке (несколько мс — «собрано», больше — «плывёт»).
  # Проверяется замером разброса на унисонах с бочкой (rhythm_lock_check.py).
  kick_residual_ms: 2.0        # на унисоне с бочкой
  snare_residual_ms: 3.0       # на малом (бэкбит)
  between_residual_ms: 4.0     # между опорами
  max_anchor_gap_frac16: 16.0  # опоры дальше такта 4/4 -> свободно
  max_shift_frac16: 0.20       # потолок барабанщика (drums_metal.yaml), иначе привязка рвётся

palm_mute_motion:
  # Глушение ладонью как движение руки (флаг --palm-mute-motion, только с
  # --humanize; запрос пользователя 2026-09-24: «сейчас статичны, должны чуть
  # отличаться и походить на настоящие движения»).
  #
  # Hydra меняет глубину глушения velocity-ю, только если в пресете включён
  # Vel -> Tightness (мануал, раздел MUTE: «lower velocities will decay even
  # faster»). Без него velocity меняет лишь громкость и слой динамики.
  #
  # Модель: к velocity каждого P.M.-бита добавляется медленный дрейф — давление
  # ладони и её место на струнах меняются плавно, а не от удара к удару
  # случайно. drift[n] = coherence * drift[n-1] + sqrt(1 - coherence^2) * N(0, std);
  # пауза длиннее reset_gap — рука встала заново, дрейф начинается с нуля.
  # Акценты доли и слабый ход вверх остаются из velocity выше.
  #
  # Числа не сняты с исполнителя: coherence 0.8 — связь держится ~5 ударов
  # (фраза чёса), std 6 — заметно, но без вылета в соседний слой. Проверяется
  # автокорреляцией velocity соседних P.M.-ударов (picking_hand_check.py).
  drift_std: 6.0
  drift_coherence: 0.8
  reset_gap_frac16: 4.0      # пауза больше доли (4/16) — новая фраза
