# Профиль оживления барабанов (metal / power metal, баллады и быстрые треки).
#
# ПОЧЕМУ ЭТО ВООБЩЕ НУЖНО. Барабаны приходят из Guitar Pro АБСОЛЮТНО плоской
# линией: замер на "The Princess and The Dragon copy.gp" показал, что ApolloTab
# отдаёт для перкуссии note.velocity = 95 на ВСЕ 1133 ноты (beat.dynamics = None),
# то есть даже те 20 битов MF, что размечены в GPIF, до выхода не доезжают.
# Сам Guitar Pro физически не умеет больше 8 градаций динамики (PPP..FFF), а для
# ударных отдаёт одну. Поэтому динамика здесь не ПЕРЕНОСИТСЯ, а СИНТЕЗИРУЕТСЯ:
# сохранять нечего.
#
# ПОЧЕМУ НЕ ИЗ ПАКА ГРУВОВ. Коммерческие паки живых грувов (проверено на
# "95 BPM - Nordic Knights", Iron Stronghold) на поверку квантованы: истинный
# джиттер std = 2.46 мс, 47% нот стоят РОВНО на сетке, 82% в пределах ±2 мс,
# при живой игре 10-30 мс. Их "11-88% нот вне 16-й сетки" — это на 16% триольные
# секстоли (музыкальная субдивизия!) плюс дизер. Переносить оттуда нечего,
# а тащить в репозиторий 18 МБ платного контента ради пары сотен байт статистики
# тем более незачем. Числа ниже — параметрические.

instrument: "Drums"
profile: "metal"
config_version: 1

velocity:
  # Опорный уровень: то, что сейчас приходит на вход (95). Все level —
  # смещения относительно него, поэтому средний уровень трека не уезжает
  # и баланс микса остаётся прежним.
  reference_level: 95
  floor: 30
  ceil: 127

  # level  — насколько лимб громче/тише опорного (у реального кита крэш
  #          заметно громче хэта, это не "разброс", а устройство инструмента)
  # std    — человеческий разброс удара по этому лимбу
  # accent — прибавка по метрической позиции: доля / офф-бит восьмая /
  #          слабая шестнадцатая. Это и есть "живой" рельеф: барабанщик
  #          бьёт сильнее на долю и слабее между.
  classes:
    kick:       {level: +4,  std: 5, accent: {beat: +6, off8: +1, e16: -5}}
    snare:      {level: +8,  std: 6, accent: {beat: +7, off8:  0, e16: -8}}
    timekeeper: {level: -8,  std: 6, accent: {beat: +7, off8: -2, e16: -6}}
    tom:        {level: +3,  std: 6, accent: {beat: +5, off8:  0, e16: -4}}
    crash:      {level: +14, std: 4, accent: {beat: +2, off8:  0, e16:  0}}

timing:
  # Синтезируется по типовым значениям живой игры. bias — систематический
  # сдвиг лимба (снейр чуть позади доли = опора, крэш чуть раньше = замах).
  classes:
    kick:       {bias_ms:  0.0, std_ms:  9.0}
    snare:      {bias_ms: +6.0, std_ms: 10.0}
    timekeeper: {bias_ms: -2.0, std_ms:  7.0}
    tom:        {bias_ms:  0.0, std_ms: 10.0}
    crash:      {bias_ms: -4.0, std_ms:  8.0}

  # Быстрые треки: живой барабанщик на 180 BPM собирается, разброс падает.
  # std *= (tempo_ref_bpm / bpm) ** tempo_exponent
  tempo_ref_bpm: 90.0
  tempo_exponent: 0.5

  # Жёсткий предел: сдвиг никогда не превышает долю шестнадцатой. Само
  # масштабируется с темпом (на 180 BPM шестнадцатая вдвое короче), поэтому
  # на быстрых треках оживление физически не может размазать рисунок.
  max_shift_frac16: 0.20

ghost_notes:
  # ВНИМАНИЕ: это единственная опция, которая ДОБАВЛЯЕТ ноты, то есть меняет
  # партию, а не только её подачу. По умолчанию выключена.
  #
  # Гост-ноты — тихие удары по рабочему между бэкбитами. На барабанах это
  # реальный приём и главный источник "живости". На гитару/бас НЕ переносится:
  # тихая лишняя нота на перегрузе — это грязь, а не жизнь.
  enabled: false
  note: 38                    # снейр
  velocity: {min: 28, max: 46}

  # РАЗМЕЩЕНИЕ. Первая версия сыпала госты равномерно-случайно по всем восьми
  # слабым шестнадцатым с density 0.35 — выходило 2.4 госта на такт при двух
  # ударах бэкбита, то есть активность рабочего больше чем удваивалась.
  # На слух: "играет раздолбай, доля не читается". Живой барабанщик кучкует
  # госты ВОКРУГ бэкбита: шестнадцатая перед ним ("а" на подходе) — классика,
  # сразу после ("е") — реже. Поэтому позиции считаются от РЕАЛЬНЫХ ударов
  # снейра в такте, а не берутся из фиксированного списка.
  prob_before: 0.45           # 16-я ПЕРЕД ударом снейра
  prob_after: 0.20            # 16-я сразу ПОСЛЕ
  max_per_bar: 2              # потолок: госты подчёркивают долю, а не спорят с ней
  # Зазор задан ДОЛЕЙ шестнадцатой, а не тиками: gp_to_shreddage работает на
  # tpb=960, standalone-скрипт на 480, и абсолютное значение молча означало бы
  # в них разное. Побочный полезный эффект: в тактах с ролловым филлом снейр
  # стоит на каждой 16-й, все позиции заняты — и госты туда не лезут сами собой.
  min_gap_frac16: 1.0
  require_backbeat: true      # только в тактах, где снейр уже играет:
                              # не оживляем тишину и сухие секции
  # Такт, где снейр бьёт столько раз и больше, — это ролловый филл, а не грув.
  # Гост-нота между ударами ролла превращает его в кашу, поэтому филлы пропускаем.
  # (Проверено: без этого правила госты лезли в такты 40/48/89/90/105 — все роллы.)
  skip_bar_if_snare_hits_gte: 5
