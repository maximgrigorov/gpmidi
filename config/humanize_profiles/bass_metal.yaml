# Профиль оживления баса (Shreddage 3.5 Darkwall, metal / power metal).
#
# ЧЕМ ОТЛИЧАЕТСЯ ОТ ГИТАРНОГО (замеры по "The Princess and The Dragon copy.gp"):
#
# 1. У DARKWALL НЕТ VEL-ЗОН. Главной гитарной мины здесь нет: в
#    shreddage_darkwall_3.5.yaml у sustain нет vel_max, а артикуляций Rake и
#    Pinch Harmonics у Darkwall не существует вовсе. Потолок обычный, 127.
#    Но клампинг всё равно идёт через карту артикуляций, а не через профиль:
#    появится vel-зона в новой версии библиотеки — правка будет там.
#
# 2. STRUM НЕ НУЖЕН. В партии 564 одиночных ноты и РОВНО ОДИН двухнотный
#    аккорд на всю песню. Басист не бьёт по струнам медиатором веером — разброс
#    по струнам здесь был бы выдумкой. Отключено.
#
# 3. БАС ТУЖЕ ГИТАРЫ ПО ТАЙМИНГУ. Он держит низ вместе с бочкой: разъехались на
#    10 мс — уже слышно как каша. Поэтому std меньше гитарного (7.0) и заметно
#    меньше барабанного (9-10).
#
# Что в партии сейчас: velocity 79 на 549 нотах из 566 (плюс 91 у 11 нот и 95
# у 6) — то есть фактически одно значение, и средний velocity по всем 16
# позициям такта лежит в диапазоне 79.0-79.5. Акцентов нет вообще.

instrument: "Bass"
profile: "metal"
config_version: 2

velocity:
  floor: 24

  # Бас без акцентов — это ровный гул. Акцент на долю возвращает ему опору.
  # Чуть скромнее гитарных (+8): бас в миксе ниже и его динамика читается
  # сильнее, перебор сразу лезет вперёд.
  accent:
    beat: +7
    off8: +2
    e16: -3
  std: 4

  articulation:
    palm_mute: -4
    sustain: +2
    staccato_long: -2

timing:
  bias_ms: 0.0
  std_ms: 6.0            # туже гитары: бас держит низ с бочкой
  tempo_ref_bpm: 90.0
  tempo_exponent: 0.5
  max_shift_frac16: 0.10 # и жёстче гитарного потолка (0.12)

strum:
  enabled: false         # см. п.2 в шапке: аккорд в партии ровно один

lock_to_drums:
  # Ритм-секция вместе (флаг --lock-to-drums, только с --humanize; решение
  # пользователя 2026-09-24: «чтобы звучали в коалиции, как в метал-группе»).
  # Бит берёт сдвиг бочки на том же нотном тике, иначе малого, между ними —
  # плавную линию тайминга барабанщика; барабанов дальше max_anchor_gap — бит
  # играется свободно (обычный timing выше).
  #
  # ЧТО МЕРЯЛИ (3 песни, нотная сетка): на бочку и малый приходится 35-70%
  # атак ритма и баса, на любой удар барабанов — до 87%. Почти-совпадений в
  # пределах 1/32 нет (0-18 на дорожку) — расхождения с бочкой это аранжировка,
  # а не ошибки транскрипции, поэтому партии НЕ правятся, сводится только тайминг.
  # Без привязки гитара и бочка расходятся на унисонах на ~11 мс (7 мс гитары и
  # 9 мс бочки независимо) — это и есть «каждый сам по себе».
  #
  # ПОЧЕМУ ТАКИЕ ЧИСЛА. С исполнителя не сняты: это допуск, с которым в метале
  # сводят бас и ритм к бочке (несколько мс — «собрано», больше — «плывёт»).
  # Проверяется замером разброса на унисонах с бочкой (rhythm_lock_check.py).
  # Бас туже гитары: он и в профиле тайминга держит низ с бочкой (6 мс против 7).
  kick_residual_ms: 1.5
  snare_residual_ms: 2.5
  between_residual_ms: 3.0
  max_anchor_gap_frac16: 16.0
  max_shift_frac16: 0.20
